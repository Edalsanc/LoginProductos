 <style>
    /* Aseguramos que las clases ocultas funcionen en Apps Script */
    .hidden {
      display: none !important;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
