
<script>
(function () {
  'use strict';

  // Referencias a los elementos de la interfaz
  const loginCard = document.getElementById('loginCard');
  const registerCard = document.getElementById('registerCard');
  const successCard = document.getElementById('successCard');

  const alertBox = document.getElementById('alertBox');
  const alertMessage = document.getElementById('alertMessage');
  const alertIcon = document.getElementById('alertIcon');

  // Evitar errores si falta algún elemento HTML
  function getElement(id) {
    const element = document.getElementById(id);

    if (!element) {
      console.error('No se encontró el elemento HTML:', id);
    }

    return element;
  }

  // Cambiar entre las vistas
  function toggleView(view) {
    hideAlert();

    if (!loginCard || !registerCard || !successCard) return;

    loginCard.classList.toggle('hidden', view !== 'login');
    registerCard.classList.toggle('hidden', view !== 'register');
    successCard.classList.add('hidden');
  }

  // Mostrar u ocultar contraseña
  function togglePasswordVisibility(inputId, btn) {
    const input = getElement(inputId);

    if (!input || !btn) return;

    const icon = btn.querySelector('i');
    const showPassword = input.type === 'password';

    input.type = showPassword ? 'text' : 'password';

    if (icon) {
      icon.className = showPassword
        ? 'fa-regular fa-eye-slash'
        : 'fa-regular fa-eye';
    }
  }

  // Mostrar alertas
  function showAlert(message, isSuccess = false) {
    if (!alertBox || !alertMessage || !alertIcon) {
      console.error(message);
      return;
    }

    alertBox.className = isSuccess
      ? 'px-5 py-3 text-sm font-medium transition-all duration-300 flex items-center justify-between bg-green-50 text-green-700 border-b border-green-200 fade-in'
      : 'px-5 py-3 text-sm font-medium transition-all duration-300 flex items-center justify-between bg-red-50 text-red-700 border-b border-red-200 fade-in';

    alertIcon.className = isSuccess
      ? 'fa-solid fa-circle-check text-green-500'
      : 'fa-solid fa-triangle-exclamation text-red-500';

    alertMessage.textContent = message;
    alertBox.classList.remove('hidden');
  }

  function hideAlert() {
    if (alertBox) {
      alertBox.classList.add('hidden');
    }
  }

  // Comprobar que Google Apps Script esté disponible
  function isAppsScriptAvailable() {
    return typeof google !== 'undefined' &&
      google.script &&
      google.script.run;
  }

  // Obtener un mensaje de error seguro
  function getErrorMessage(error, defaultMessage) {
    return error && error.message
      ? error.message
      : defaultMessage;
  }

  // Mostrar estado de carga
  function setLoading(formType, isLoading) {
    const prefix = formType === 'login' ? 'login' : 'reg';

    const btn = getElement(prefix + 'Btn');
    const text = getElement(prefix + 'BtnText');
    const spinner = getElement(prefix + 'BtnSpinner');

    if (btn) btn.disabled = isLoading;
    if (text) text.classList.toggle('hidden', isLoading);
    if (spinner) spinner.classList.toggle('hidden', !isLoading);

    if (isLoading) hideAlert();
  }

  // Inicio de sesión
  function handleLoginSubmit() {
    const emailInput = getElement('loginEmail');
    const passwordInput = getElement('loginPassword');

    if (!emailInput || !passwordInput) return;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAlert('Por favor, ingresa tu correo y contraseña.');
      return;
    }

    if (!emailInput.checkValidity()) {
      showAlert('Ingresa un correo electrónico válido.');
      return;
    }

    if (getElement('loginBtn')?.disabled) return;

    setLoading('login', true);

    if (!isAppsScriptAvailable()) {
      setLoading('login', false);
      showAlert(
        'No se detectó Google Apps Script. Abre la aplicación desde su URL publicada.'
      );
      return;
    }

    google.script.run
      .withSuccessHandler(function (response) {
        setLoading('login', false);

        if (response && response.success && response.user) {
          showSuccessView(response.user);
        } else {
          showAlert(
            response && response.message
              ? response.message
              : 'No fue posible verificar las credenciales.'
          );
        }
      })
      .withFailureHandler(function (error) {
        setLoading('login', false);
        showAlert(
          'Error al iniciar sesión: ' +
          getErrorMessage(error, 'Error desconocido del servidor.')
        );
        console.error('Error de inicio de sesión:', error);
      })
      .handleLogin({
        email: email,
        password: password
      });
  }

  // Registro de usuario
  function handleRegisterSubmit() {
    const nameInput = getElement('regName');
    const emailInput = getElement('regEmail');
    const passwordInput = getElement('regPassword');
    const confirmInput = getElement('regConfirmPassword');

    if (!nameInput || !emailInput ||
        !passwordInput || !confirmInput) return;

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (!name || !email || !password || !confirmPassword) {
      showAlert('Por favor, completa todos los campos.');
      return;
    }

    if (!emailInput.checkValidity()) {
      showAlert('Ingresa un correo electrónico válido.');
      return;
    }

    if (password.length < 6) {
      showAlert('La contraseña debe tener al menos 6 caracteres.');
      return;
    }

    if (password !== confirmPassword) {
      showAlert('Las contraseñas no coinciden.');
      return;
    }

    if (getElement('regBtn')?.disabled) return;

    setLoading('register', true);

    if (!isAppsScriptAvailable()) {
      setLoading('register', false);
      showAlert(
        'No se detectó Google Apps Script. Abre la aplicación desde su URL publicada.'
      );
      return;
    }

    google.script.run
      .withSuccessHandler(function (response) {
        setLoading('register', false);

        if (response && response.success && response.user) {
          showSuccessView(response.user);
        } else {
          showAlert(
            response && response.message
              ? response.message
              : 'No fue posible crear la cuenta.'
          );
        }
      })
      .withFailureHandler(function (error) {
        setLoading('register', false);
        showAlert(
          'Error al registrar el usuario: ' +
          getErrorMessage(error, 'Error desconocido del servidor.')
        );
        console.error('Error de registro:', error);
      })
      .handleRegister({
        name: name,
        email: email,
        password: password
      });
  }

  // Mostrar los datos del usuario autenticado
  function showSuccessView(user) {
    if (!user || typeof user !== 'object') {
      showAlert('El servidor no devolvió datos válidos del usuario.');
      return;
    }

    hideAlert();

    if (loginCard) loginCard.classList.add('hidden');
    if (registerCard) registerCard.classList.add('hidden');
    if (successCard) successCard.classList.remove('hidden');

    const idElement = getElement('successUserId');
    const nameElement = getElement('successUserName');
    const emailElement = getElement('successUserEmail');

    if (idElement) idElement.textContent = user.id || 'N/A';
    if (nameElement) nameElement.textContent = user.name || 'Usuario';
    if (emailElement) emailElement.textContent = user.email || '';
  }

  // Copiar ID de usuario
  async function copyUserId() {
    const idElement = getElement('successUserId');
    const copyIcon = getElement('copyIcon');

    if (!idElement) return;

    const userId = idElement.textContent.trim();

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(userId);
      } else {
        const tempInput = document.createElement('textarea');
        tempInput.value = userId;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';

        document.body.appendChild(tempInput);
        tempInput.select();

        const copied = document.execCommand('copy');
        tempInput.remove();

        if (!copied) throw new Error('No se pudo copiar el ID.');
      }

      if (copyIcon) {
        copyIcon.className = 'fa-solid fa-check text-green-500';

        setTimeout(function () {
          copyIcon.className = 'fa-regular fa-copy';
        }, 2000);
      }
    } catch (error) {
      showAlert('No se pudo copiar el ID. Cópialo manualmente.');
      console.error('Error al copiar ID:', error);
    }
  }

  // Cerrar sesión y limpiar formularios
  function logout() {
    const loginForm = getElement('loginForm');
    const registerForm = getElement('registerForm');

    if (loginForm) loginForm.reset();
    if (registerForm) registerForm.reset();

    toggleView('login');
  }

  // Exponer las funciones para los atributos onclick del HTML
  window.toggleView = toggleView;
  window.togglePasswordVisibility = togglePasswordVisibility;
  window.showAlert = showAlert;
  window.hideAlert = hideAlert;
  window.handleLoginSubmit = handleLoginSubmit;
  window.handleRegisterSubmit = handleRegisterSubmit;
  window.showSuccessView = showSuccessView;
  window.copyUserId = copyUserId;
  window.logout = logout;
  window.setLoading = setLoading;

})();
</script>
